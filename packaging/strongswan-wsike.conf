# Installed by wsike. Only affects charon-systemd (strongswan.service),
# not NetworkManager's charon-nm.
charon-systemd {
  # wsike does its own policy routing through the wsike0 XFRM interface
  install_routes = no
  routing_table = 0
  install_virtual_ip = yes
  install_virtual_ip_on = wsike0
  plugins {
    socket-default {
      # IKE packets bypass the tunnel routing table and the kill switch
      fwmark = 0x5753
    }
    kernel-netlink {
      fwmark = 0x5753
    }
    resolve {
      # pushed DNS servers are attached to wsike0 in systemd-resolved
      resolvconf {
        iface = wsike0
      }
    }
  }
}
